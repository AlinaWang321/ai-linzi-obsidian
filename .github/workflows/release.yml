name: Publish plugin release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release tag matches manifest version
        run: |
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('manifest.json','utf8')).version; if(process.env.GITHUB_REF_NAME!==v){console.error('Release tag must exactly match manifest version: '+v); process.exit(1)}"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete regression suite
        run: npm test
      - name: Run strict lint and marketplace policy checks
        run: npm run check:marketplace
      - name: Build release assets
        run: npm run package:release
      - name: Generate build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
